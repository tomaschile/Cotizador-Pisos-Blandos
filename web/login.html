<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizador de Pisos Blandos — Ingreso</title>
<style>
  :root {
    --bg:#ffffff; --panel:#fff; --text:#1a1d21; --muted:#5b6570; --border:#d7dce1;
    --accent:#1f2a44; --accent-text:#fff; --err-bg:#fdecec; --err-border:#f0b4b4; --err-text:#8a2020;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1216; --panel:#1a1e24; --text:#e8eaed; --muted:#9aa4af; --border:#2c333c;
      --accent:#4f8cff; --accent-text:#0b1020; --err-bg:#2a1618; --err-border:#5c2f33; --err-text:#f0a9a9;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:0 16px 64px}
  .wrap{max-width:460px;margin:0 auto}
  .logos{display:flex;align-items:center;justify-content:center;background:#fff;
    border-bottom:1px solid var(--border);border-radius:0 0 12px 12px;padding:18px 16px;margin:0 -16px 28px}
  .logos img{height:34px;width:auto;display:block}
  h1{font-size:1.5rem;margin:0 0 6px;letter-spacing:.02em;text-align:center}
  .sub{color:var(--muted);margin:0 0 24px;text-align:center;font-size:.92rem}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:var(--shadow)}
  form{display:grid;gap:16px}
  label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
  input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--text);font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  button{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;border:1px solid transparent;
    padding:12px 18px;background:var(--accent);color:var(--accent-text);width:100%}
  button:disabled{opacity:.6;cursor:progress}
  .status{margin-top:16px;font-size:.92rem;display:none}
  .status.show{display:block}
  .status.err{background:var(--err-bg);border:1px solid var(--err-border);color:var(--err-text);
    border-radius:8px;padding:12px}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logos">
    <a href="https://www.mk.cl" target="_blank" rel="noopener"><img src="/assets/logo-mk.svg" alt="MK"></a>
  </div>

  <h1>COTIZADOR DE PISOS BLANDOS</h1>
  <p class="sub">Ingresa tu correo para continuar.</p>

  <div class="card">
    <form id="form">
      <div>
        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" autocomplete="email" required placeholder="nombre@empresa.cl">
      </div>
      <button type="submit" id="submitBtn">Entrar</button>
    </form>
    <div id="status" class="status" aria-live="polite"></div>
  </div>

  <footer>Herramienta interna · MK</footer>
</div>

<script>
(function () {
  var form = document.getElementById('form');
  var btn = document.getElementById('submitBtn');
  var status = document.getElementById('status');
  var correoInput = document.getElementById('correo');
  var CLAVE_CORREO = 'pisos_blandos_ultimo_correo';

  try {
    var ultimo = localStorage.getItem(CLAVE_CORREO);
    if (ultimo) correoInput.value = ultimo;
  } catch (e) {}

  function show(msg, isErr) {
    status.className = 'status show' + (isErr ? ' err' : '');
    status.textContent = msg;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    btn.disabled = true;
    status.className = 'status';

    fetch('/login', { method: 'POST', body: new FormData(form) })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error(j.detail || ('Error ' + r.status));
          return j;
        });
      })
      .then(function (j) {
        try { localStorage.setItem(CLAVE_CORREO, correoInput.value); } catch (e) {}
        window.location = j.redirect || '/cotizador';
      })
      .catch(function (err) { show(err.message, true); btn.disabled = false; });
  });
})();
</script>
</body>
</html>
